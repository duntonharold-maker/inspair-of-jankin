<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    rect.b{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.2s ease-in-out infinite}
    .b2{animation-delay:-.9s!important}.b3{animation-delay:-.4s!important}.b4{animation-delay:-1.1s!important}.b5{animation-delay:-.6s!important}.b6{animation-delay:-.2s!important}.b7{animation-delay:-.75s!important}
    @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  </style>
  <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7048e8"/><stop offset="1" stop-color="#f783ac"/></linearGradient></defs>
  <rect width="320" height="240" rx="48" fill="#14121c"/>
  <g fill="url(#g)">
    <rect class="b" x="70" y="60" width="16" height="120" rx="8"/>
    <rect class="b b2" x="98" y="60" width="16" height="120" rx="8"/>
    <rect class="b b3" x="126" y="60" width="16" height="120" rx="8"/>
    <rect class="b b4" x="154" y="60" width="16" height="120" rx="8"/>
    <rect class="b b5" x="182" y="60" width="16" height="120" rx="8"/>
    <rect class="b b6" x="210" y="60" width="16" height="120" rx="8"/>
    <rect class="b b7" x="238" y="60" width="16" height="120" rx="8"/>
  </g>
</svg>
