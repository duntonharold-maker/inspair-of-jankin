<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <style>
    .spin{animation:r 1.4s linear infinite;transform-origin:120px 120px}
    .spin2{animation:r 2.8s linear infinite reverse;transform-origin:120px 120px}
    .arc{animation:a 1.4s ease-in-out infinite}
    @keyframes r{to{transform:rotate(360deg)}}
    @keyframes a{0%,100%{stroke-dasharray:30 260}50%{stroke-dasharray:160 130}}
  </style>
  <rect width="240" height="240" rx="56" fill="#0f1115"/>
  <circle cx="120" cy="120" r="46" fill="none" stroke="#262a33" stroke-width="10"/>
  <g class="spin"><circle class="arc" cx="120" cy="120" r="46" fill="none" stroke="#5ee7df" stroke-width="10" stroke-linecap="round"/></g>
  <g class="spin2"><circle cx="120" cy="52" r="7" fill="#f9d423"/></g>
</svg>
