<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inspair 采集</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/48.png" alt="" width="28" height="28" />
        <h1>inspair 采集</h1>
      </header>
      <p class="how">在网页图片上右键，选「收藏到 inspair」。图片会先进网站的收件箱，跟 Claude 说「整理收件箱」后上线。</p>

      <section id="inbox" class="inbox" aria-labelledby="inbox-title" hidden>
        <div class="inbox-head">
          <h2 id="inbox-title">收件箱 <span id="count" class="count"></span></h2>
          <button id="refresh" class="icon-btn" type="button" aria-label="刷新收件箱">
            <!-- Lucide: rotate-cw -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
          </button>
        </div>
        <p id="empty" class="empty" hidden>收件箱是空的。</p>
        <ul id="grid" class="grid"></ul>
        <div id="bar" class="bar" hidden>
          <p id="bar-text" role="status"></p>
          <button id="bar-cancel" class="bar-btn" type="button">取消</button>
          <button id="bar-group" class="bar-btn bar-btn--go" type="button">合成一组</button>
        </div>
      </section>

      <h2 class="settings-title">连接</h2>
      <form id="form" novalidate>
        <label for="site">网站地址</label>
        <input id="site" name="site" type="url" inputmode="url" autocomplete="url" spellcheck="false" required />

        <label for="key">密钥</label>
        <div class="key">
          <input id="key" name="key" type="password" autocomplete="off" spellcheck="false" required placeholder="COLLECT_SECRET 或 MCP_SECRET" />
          <button id="reveal" class="icon-btn" type="button" aria-label="显示密钥" aria-pressed="false">
            <!-- Lucide: eye / eye-off -->
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></svg>
          </button>
        </div>

        <button id="save" class="btn" type="submit">保存并测试连接</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </main>

    <template id="tile">
      <li class="tile">
        <button class="pic" type="button"><img alt="" decoding="async" /><span class="n" hidden></span></button>
        <button class="pick" type="button" aria-pressed="false">
          <!-- Lucide: check -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
          <span></span>
        </button>
        <div class="meta">
          <p class="title"></p>
          <p class="remark"></p>
          <p class="where"><span class="cat"></span><a class="src" target="_blank" rel="noopener noreferrer"
            ><span></span
            ><!-- Lucide: external-link --><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg
          ></a></p>
        </div>
        <button class="del" type="button">
          <!-- Lucide: trash -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11v6" /><path d="M14 11v6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
          <span>删除</span>
        </button>
      </li>
    </template>

    <dialog id="viewer" aria-labelledby="viewer-title">
      <figure>
        <div class="viewer-stage">
          <img id="viewer-img" alt="" />
          <button id="viewer-prev" class="icon-btn flip flip--prev" type="button" aria-label="这一组的上一张" hidden>
            <!-- Lucide: chevron-left -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <button id="viewer-next" class="icon-btn flip flip--next" type="button" aria-label="这一组的下一张" hidden>
            <!-- Lucide: chevron-right -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
        <figcaption>
          <span id="viewer-count" class="viewer-count" hidden></span>
          <p id="viewer-title"></p>
          <button id="viewer-close" class="icon-btn" type="button" aria-label="关闭">
            <!-- Lucide: x -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </figcaption>
      </figure>
    </dialog>
    <script src="options.js"></script>
  </body>
</html>
